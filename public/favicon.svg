<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Architectural Dark Rounded Canvas for universal browser contrast -->
  <rect width="100" height="100" rx="24" fill="#1C1B19"/>
  <!-- Circular Drafting Frame -->
  <circle cx="47" cy="47" r="33" stroke="#FFFFFF" stroke-width="4.5"/>
  <!-- Diamond Facet Shading -->
  <polygon points="47,24 47,47 64,47" fill="rgba(183, 154, 107, 0.3)"/>
  <polygon points="47,70 47,47 30,47" fill="rgba(183, 154, 107, 0.3)"/>
  <!-- Diamond Kite Contour -->
  <polygon points="47,24 64,47 47,70 30,47" stroke="#B79A6B" stroke-width="3" stroke-linejoin="round" fill="rgba(183, 154, 107, 0.1)"/>
  <!-- Compass Axes -->
  <line x1="47" y1="24" x2="47" y2="70" stroke="#B79A6B" stroke-width="2.2"/>
  <line x1="30" y1="47" x2="64" y2="47" stroke="#B79A6B" stroke-width="2.2"/>
  <!-- Q-Tail -->
  <path d="M57 57 L82 82" stroke="#B79A6B" stroke-width="7" stroke-linecap="round"/>
</svg>